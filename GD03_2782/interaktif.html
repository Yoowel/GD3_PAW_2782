<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Interaktif</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="judulHalaman">Halaman Interaktif</h1>
    <p id="teks">Teks ini bisa berubah!</p>
    <button onclick="ubahBiru()">Ubah teks menjadi biru</button>

    <br><br>
    <label for="inputNama">Masukan nama: </label>
    <input type="text" id="inputNama">
    <br>
    <button onclick="tampilkanNama()">Tampilkan</button>

    <br><br>
    <h3>Hitung Kuadrat</h3>

    <label for="inputAngka">Masukkan angka: </label>
    <input type="number" id="inputAngka">

    <button onclick="hitungKuadrat()">Hitung</button>

    <p id="hasil"></p>

    <br><br>
    <a href="profile.html" onclick="return confirm('Kembali ke halaman Profile?')">Profile</a>
    <a href="form.html" onclick="return confirm('Pindah ke halaman Form Pendaftaran?')">Form Pendaftaran</a>    

    <script>
        
        document.getElementById("judulHalaman").style.color = "red";
        console.log(document.getElementById("judulHalaman").innerHTML);

        function sapa(nama) {
            return "Halo " + nama + "!"; 
        }

        console.log(sapa("Yoel"));

        function ubahBiru() {
            const teks = document.getElementById("teks");
            teks.style.color = "blue";
        }

        function tampilkanNama() {
            const nama = document.getElementById("inputNama").value;
            if(nama == "") {
                alert("Silakan isi nama terlebih dahulu");
            } else {
                alert("Halo, " + nama + "!");
            }
        }

        function hitungKuadrat() {
            const angka = document.getElementById("inputAngka").value;
            const hasil = angka * angka;

            document.getElementById("hasil").innerHTML = "Hasil: " + hasil;
        }

    </script>
</body>
</html>
